name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - cursor/mobile-html-port-0d70
    paths:
      - "mobile/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy mobile game to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mobile
          force_orphan: true
